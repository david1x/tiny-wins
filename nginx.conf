# Static-file server for the Tiny Wins PWA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the text assets
    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length 512;

    # The service worker and the entry document must always revalidate,
    # so a new deploy is picked up instead of a stale cached copy.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        default_type application/javascript;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # App code and icons can be cached briefly.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Sync API → the Node container on the compose network. Never cached.
    location /api/ {
        proxy_pass http://tiny-wins-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    # The app uses hash routing, so any unknown path falls back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
